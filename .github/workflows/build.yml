name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Opt the runner into Node.js 24 for JS-based actions. Node 20 is
# deprecated (default flips 2026-06-02, removed 2026-09-16); setting
# this now silences the runner warning and keeps our existing action
# pins unchanged. Revisit when we next bump action versions.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  wheels:
    name: wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify submodule commit matches LIBAVOID_COMMIT.txt
        shell: bash
        run: |
          pinned=$(cat LIBAVOID_COMMIT.txt | tr -d '[:space:]')
          actual=$(git -C vendor/adaptagrams rev-parse HEAD)
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "::error::LIBAVOID_COMMIT.txt ($pinned) does not match submodule HEAD ($actual). Bump both together." >&2
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21
        env:
          CIBW_ARCHS_LINUX: x86_64
          CIBW_ARCHS_WINDOWS: AMD64

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build --sdist

      - name: Check sdist metadata
        run: |
          python -m pip install twine
          python -m twine check dist/*.tar.gz

      - name: Upload sdist
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
